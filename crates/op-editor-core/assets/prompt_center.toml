[[prompt]]
id = "starter-travel-app"
category = "starter"
tags = ["quick-action", "travel", "mobile-app"]
title_key = "ai.quickAction.travelApp"
title_fallback = "旅行预订 App 发现页"
body_zh = '''设计一个旅行预订App发现页。包含搜索区"想去哪？"输入框、日期选择标签、人数选择。热门目的地横向滑动卡片（目的地照片、城市名、起步价），"本周特惠"区2张特惠卡片带折扣标签，最近浏览区2张紧凑卡片。底部导航栏（发现、收藏、行程、消息、个人）。温暖友好的设计，橙色点缀。'''
body_en = '''Design a travel booking mobile app explore page. Include a search section with "Where to?" input, date picker chips, and guest count. Popular destinations as horizontal scrollable cards with destination photos, city names and starting prices. "Deals of the Week" section with 2 featured deal cards showing discount badges. Recently viewed section with 2 compact cards. Bottom tab bar (Explore, Wishlists, Trips, Messages, Profile). Warm, inviting design with orange accents.'''

[[prompt]]
id = "starter-dashboard"
category = "starter"
tags = ["quick-action", "music", "mobile-app", "dashboard"]
title_key = "ai.quickAction.dashboard"
title_fallback = "暗色音乐流媒体 App 首页"
body_zh = '''设计一个暗色音乐流媒体App首页。包含问候语"晚上好"、"最近播放"横向滑动专辑封面卡片、"为你推荐"区3张歌单卡片（封面和歌单名）、"新发行"区4张专辑卡片2x2网格、底部悬浮迷你播放器（当前曲目+播放/暂停控件）。底部导航栏（首页、搜索、音乐库、会员）。深色背景搭配荧光绿强调。'''
body_en = '''Design a dark-themed music streaming mobile app home screen. Include a greeting "Good evening", horizontal scrollable "Recently Played" album art cards, "Made For You" section with 3 playlist cards showing cover art and playlist names, "New Releases" section with 4 album cards in a 2x2 grid, and a floating mini player bar at the bottom showing current track with play/pause controls. Bottom tab bar (Home, Search, Library, Premium). Dark background with lime green accent.'''

