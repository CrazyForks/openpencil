# Include inside the TLS-enabled server block for the locator hostname.
# TLS certificates, HSTS, and operator-specific network ACLs belong to that
# server block. Do not expose the Rust container port directly.

location = /v1/locator {
    if ($request_uri != "/v1/locator") {
        return 404;
    }
    if ($http_host = "") {
        return 400;
    }

    access_log off;
    limit_req zone=openpencil_locator_per_source burst=20 nodelay;
    limit_req_status 429;
    limit_conn openpencil_locator_connections 16;
    limit_conn_status 429;
    client_max_body_size 191;
    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Accept $http_accept;
    proxy_pass http://locator:8092/v1/locator;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_buffering off;
}

location = /healthz {
    access_log off;
    limit_req zone=openpencil_locator_per_source burst=20 nodelay;
    limit_req_status 429;
    limit_conn openpencil_locator_connections 16;
    limit_conn_status 429;
    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_pass http://locator:8092/healthz;
}

location / {
    return 404;
}
